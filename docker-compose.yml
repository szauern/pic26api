services:
  postgres:
    image: postgres:16-alpine
    container_name: project_postgres
    environment:
      POSTGRES_DB: projectdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: project_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  django:
    build:
      context: ./django
      dockerfile: Dockerfile
    container_name: project_django
    environment:
      DATABASE_URL: postgresql://django_user:django_secret@postgres:5432/projectdb
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1,django"
    volumes:
      - django_static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/admin/login/')\" 2>/dev/null && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - internal

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: project_fastapi
    environment:
      DATABASE_URL: postgresql+asyncpg://fastapi_user:fastapi_secret@postgres:5432/projectdb
      REDIS_URL: redis://redis:6379/0
      TOKEN_CACHE_TTL: "300"
      TRANSLATION_CACHE_TTL: "3600"
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: project_nginx
    ports:
      - "5042:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - django_static:/static:ro
    depends_on:
      django:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  django_static:

networks:
  internal:
    driver: bridge
