events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream fastapi {
        server fastapi:8000;
    }

    upstream django {
        server django:8001;
    }

    server {
        listen 80;
        server_name localhost;

        # FastAPI
        location /api/ {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /docs {
            proxy_pass http://fastapi/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://fastapi/openapi.json;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://fastapi/redoc;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://fastapi/health;
            proxy_set_header Host $host;
        }

        # Django admin - minden redirect-et átírunk
        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Django belső redirect-jeit átírjuk a helyes külső URL-re
            proxy_redirect http://django:8001/admin/ /admin/;
            proxy_redirect http://localhost/admin/ /admin/;
            proxy_redirect http://localhost:8001/admin/ /admin/;
        }

        location /static/ {
            alias /static/;
            expires 1d;
        }
    }
}
